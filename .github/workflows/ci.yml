name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Repo targets Bun 1.4 canary; switch to a pin once 1.4 is stable.
          bun-version: canary

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests (@typeway/connect)
        run: bun test packages/

      - name: Integration smoke test
        run: bun run test:integration

      - name: TanStack feature coverage (dev + prod)
        run: bun run test:e2e-tanstack
